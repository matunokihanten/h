<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ワーキングメモリートレーニング（モバイル最適化版）</title>
<style>
    /* モバイル向けリセット＆ベース設定 */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        background-color: #ecf0f1;
        color: #2c3e50;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        overflow: hidden; /* 全体のスクロールを禁止 */
        user-select: none; /* 誤タップによるテキスト選択防止 */
    }
    #app-container {
        background: #fff;
        width: 100%;
        height: 100%;
        max-width: 450px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 15px;
        position: relative;
    }
    /* デスクトップ表示時は角丸とシャドウをつける */
    @media (min-width: 451px) {
        #app-container {
            height: 90vh;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    }

    h1 { font-size: 18px; text-align: center; margin-bottom: 15px; color: #34495e; }
    .screen { display: none; width: 100%; text-align: center; }
    .active { display: block; }
    
    /* --- 超コンパクト設定パネル --- */
    .settings-panel {
        background: #f8f9fa;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #e9ecef;
        margin-bottom: 15px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }
    .setting-group {
        display: flex;
        flex-direction: column;
        text-align: left;
    }
    .setting-group.full {
        grid-column: span 2;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #dee2e6;
        padding-bottom: 8px;
        margin-bottom: 4px;
    }
    .setting-group.full select { width: 65%; }
    .setting-group label {
        font-size: 12px;
        font-weight: bold;
        color: #7f8c8d;
        margin-bottom: 2px;
    }
    select {
        padding: 6px;
        border-radius: 6px;
        border: 1px solid #bdc3c7;
        font-size: 14px;
        background: #fff;
        outline: none;
        color: #2c3e50;
    }

    /* --- メインコンテンツUI --- */
    .header-badge {
        display: inline-block;
        background: #e74c3c;
        color: white;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: bold;
        margin-bottom: 8px;
    }
    .number-display {
        font-size: 36px;
        font-weight: bold;
        letter-spacing: 4px;
        color: #2980b9;
        margin: 15px 0;
        word-wrap: break-word;
    }
    .order-display {
        font-size: 16px;
        font-weight: bold;
        color: #d35400;
        background: #fdf2e9;
        padding: 12px;
        border-radius: 8px;
        margin: 10px 0;
        text-align: left;
        line-height: 1.5;
    }
    .math-display {
        font-size: 26px;
        margin: 15px 0;
        line-height: 1.3;
    }
    .bill-info {
        font-size: 18px;
        background: #e8f8f5;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 10px;
    }
    
    /* 入力フォームとボタン */
    input[type="number"] {
        font-size: 24px;
        padding: 10px;
        width: 100%;
        text-align: center;
        border: 2px solid #bdc3c7;
        border-radius: 8px;
        margin-bottom: 15px;
        outline: none;
        background: #fff;
    }
    input[type="number"]:focus { border-color: #3498db; }
    
    button {
        background-color: #3498db;
        color: white;
        border: none;
        padding: 14px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button:active { transform: translateY(2px); box-shadow: none; }
    
    .cancel-btn {
        background-color: #95a5a6;
        margin-top: 10px;
        padding: 12px;
        font-size: 14px;
        box-shadow: none;
    }
    
    /* --- コンパクトな回答メニューグリッド --- */
    .menu-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 15px;
    }
    .menu-item {
        background: #f8f9fa;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .menu-name { font-weight: bold; font-size: 13px; }
    .menu-item select { font-size: 14px; padding: 2px 4px; width: 45px; text-align: center; }

    .progress { font-size: 13px; color: #95a5a6; margin-bottom: 5px; font-weight: bold; }
    .result-text { font-size: 16px; margin: 8px 0; }
    .correct { color: #27ae60; font-weight: bold; }
    .incorrect { color: #c0392b; font-weight: bold; }
    p { font-size: 14px; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="app-container">
    <!-- スタート画面 -->
    <div id="screen-start" class="screen active">
        <h1>ワーキングメモリートレーニング</h1>
        
        <div class="settings-panel">
            <!-- モード選択 (全幅) -->
            <div class="setting-group full">
                <label>モード選択</label>
                <select id="set-mode" onchange="toggleModeSettings()">
                    <option value="restaurant" selected>松乃木飯店 オーダーモード</option>
                    <option value="number">数字記憶モード</option>
                </select>
            </div>
            
            <!-- モードごとの個別設定 (JSで表示切替) -->
            <div class="setting-group mode-number" style="display: none;">
                <label>覚える桁数</label>
                <select id="set-digits">
                    <option value="4">4桁</option>
                    <option value="6" selected>6桁</option>
                    <option value="8">8桁</option>
                    <option value="10">10桁</option>
                    <option value="12">12桁 (神)</option>
                </select>
            </div>

            <div class="setting-group mode-restaurant">
                <label>注文の品数</label>
                <select id="set-items">
                    <option value="2">2品</option>
                    <option value="3" selected>3品</option>
                    <option value="4">4品</option>
                    <option value="5">5品 (激務)</option>
                    <option value="6">6品 (パニック)</option>
                </select>
            </div>

            <!-- 共通設定 -->
            <div class="setting-group">
                <label>表示時間</label>
                <select id="set-time">
                    <option value="2">2秒</option>
                    <option value="4">4秒</option>
                    <option value="8" selected>8秒</option>
                    <option value="unlimited">無制限</option>
                </select>
            </div>
            
            <div class="setting-group">
                <label>間の問題数</label>
                <select id="set-math-count">
                    <option value="3" selected>3問</option>
                    <option value="5">5問</option>
                    <option value="10">10問</option>
                </select>
            </div>
            
            <div class="setting-group">
                <label>計算難易度</label>
                <select id="set-math-diff">
                    <option value="easy">やさしい</option>
                    <option value="normal" selected>標準</option>
                    <option value="hard">ハード(暗算)</option>
                </select>
            </div>
        </div>

        <button onclick="startTraining()">スタート</button>
    </div>

    <!-- 記憶画面 -->
    <div id="screen-memorize" class="screen">
        <div id="memo-header" class="header-badge"></div>
        <h1 id="memo-title" style="margin-bottom: 5px;"></h1>
        <div id="target-number" class="number-display" style="display: none;"></div>
        <div id="target-order" class="order-display" style="display: none;"></div>
        <p id="timer-text" style="font-weight: bold; color: #c0392b;"></p>
        <button id="memorize-next-btn" onclick="startMathPhase()">覚えたので次へ</button>
        <button class="cancel-btn" onclick="resetTraining()">中断して戻る</button>
    </div>

    <!-- 計算・お会計画面 -->
    <div id="screen-math" class="screen">
        <div id="math-header" class="header-badge"></div>
        <div class="progress" id="math-progress"></div>
        <div id="math-question" class="math-display"></div>
        <input type="number" id="math-answer" placeholder="答えを入力" onkeypress="handleMathEnter(event)" pattern="\d*">
        <button id="math-next-btn" onclick="nextMath()">次へ</button>
        <button class="cancel-btn" onclick="resetTraining()">中断して戻る</button>
    </div>

    <!-- 思い出し画面 -->
    <div id="screen-recall" class="screen">
        <h1 id="recall-title"></h1>
        <p style="margin-bottom: 10px;">記憶を頼りに入力してください</p>
        <input type="number" id="recall-answer-number" placeholder="数字を入力" onkeypress="handleRecallEnter(event)" pattern="\d*" style="display: none;">
        <div id="recall-answer-order" class="menu-grid" style="display: none;"></div>
        <button onclick="showResult()">結果を見る</button>
        <button class="cancel-btn" onclick="resetTraining()">中断して戻る</button>
    </div>

    <!-- 結果画面 -->
    <div id="screen-result" class="screen">
        <h1>結果発表</h1>
        <div id="result-details" style="text-align: left; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px;"></div>
        <button onclick="resetTraining()">設定に戻る</button>
    </div>
</div>

<script>
    const MENU_LIST = ["ラーメン", "チャーハン", "餃子", "麻婆豆腐", "エビチリ", "春巻き", "青椒肉絲", "唐揚げ", "杏仁豆腐", "生ビール"];
    
    let currentMode = "restaurant";
    let targetData = null;
    let mathQuestions = [];
    let currentMathIndex = 0;
    let mathScore = 0;
    let totalMathCount = 3;
    let countdownTimer;

    function toggleModeSettings() {
        currentMode = document.getElementById('set-mode').value;
        const numSettings = document.querySelectorAll('.mode-number');
        const restSettings = document.querySelectorAll('.mode-restaurant');
        
        if (currentMode === 'number') {
            numSettings.forEach(el => el.style.display = 'flex');
            restSettings.forEach(el => el.style.display = 'none');
        } else {
            numSettings.forEach(el => el.style.display = 'none');
            restSettings.forEach(el => el.style.display = 'flex');
        }
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startTraining() {
        const timeValue = document.getElementById('set-time').value;
        totalMathCount = parseInt(document.getElementById('set-math-count').value, 10);
        
        if (currentMode === 'number') {
            setupNumberMode();
        } else {
            setupRestaurantMode();
        }

        currentMathIndex = 0;
        mathScore = 0;
        showScreen('screen-memorize');

        clearInterval(countdownTimer);
        const timerText = document.getElementById('timer-text');
        const memoNextBtn = document.getElementById('memorize-next-btn');

        if (timeValue === "unlimited") {
            timerText.textContent = "記憶できたらボタンを押してください";
            memoNextBtn.textContent = "覚えたので次へ";
        } else {
            let timeLeft = parseInt(timeValue, 10);
            timerText.textContent = `残り ${timeLeft} 秒`;
            memoNextBtn.textContent = "スキップして次へ";
            countdownTimer = setInterval(() => {
                timeLeft--;
                timerText.textContent = `残り ${timeLeft} 秒`;
                if (timeLeft <= 0) startMathPhase();
            }, 1000);
        }
    }

    function setupNumberMode() {
        document.getElementById('memo-header').style.display = 'none';
        document.getElementById('memo-title').textContent = "数字を暗記";
        document.getElementById('target-number').style.display = 'block';
        document.getElementById('target-order').style.display = 'none';
        
        const digits = parseInt(document.getElementById('set-digits').value, 10);
        targetData = (Math.floor(Math.random() * 9) + 1).toString();
        for (let i = 1; i < digits; i++) {
            targetData += Math.floor(Math.random() * 10).toString();
        }
        document.getElementById('target-number').textContent = targetData;
        
        const mathDiff = document.getElementById('set-math-diff').value;
        mathQuestions = [];
        for (let i = 0; i < totalMathCount; i++) {
            let a, b;
            if(mathDiff === 'easy') {
                a = Math.floor(Math.random() * 9) + 1;
                b = Math.floor(Math.random() * 9) + 1;
            } else if(mathDiff === 'normal') {
                a = Math.floor(Math.random() * 90) + 10;
                b = Math.floor(Math.random() * 9) + 1;
            } else {
                a = Math.floor(Math.random() * 90) + 10;
                b = Math.floor(Math.random() * 90) + 10;
            }
            let isAddition = Math.random() > 0.5;
            if (isAddition) {
                mathQuestions.push({ text: `${a} + ${b} = ?`, ans: a + b });
            } else {
                if(a < b) { let temp = a; a = b; b = temp; }
                mathQuestions.push({ text: `${a} - ${b} = ?`, ans: a - b });
            }
        }
    }

    function setupRestaurantMode() {
        document.getElementById('memo-header').style.display = 'inline-block';
        document.getElementById('memo-header').textContent = "新規オーダー";
        document.getElementById('memo-title').textContent = "テーブル注文";
        document.getElementById('target-number').style.display = 'none';
        document.getElementById('target-order').style.display = 'block';
        
        const itemQty = parseInt(document.getElementById('set-items').value, 10);
        let shuffled = [...MENU_LIST].sort(() => 0.5 - Math.random());
        let selectedItems = shuffled.slice(0, itemQty);
        
        targetData = {};
        let orderHTML = "";
        selectedItems.forEach(item => {
            let qty = Math.floor(Math.random() * 3) + 1;
            targetData[item] = qty;
            orderHTML += `・${item} <span style="float:right;">${qty} つ</span><br>`;
        });
        document.getElementById('target-order').innerHTML = orderHTML;
        
        const mathDiff = document.getElementById('set-math-diff').value;
        mathQuestions = [];
        for (let i = 0; i < totalMathCount; i++) {
            let bill, paid;
            if(mathDiff === 'easy') {
                bill = (Math.floor(Math.random() * 7) + 2) * 500; 
                paid = bill + 1000;
                if(paid > 5000) paid = 10000; else paid = 5000;
            } else if(mathDiff === 'normal') {
                bill = (Math.floor(Math.random() * 60) + 16) * 50; 
                let options = [Math.ceil(bill/1000)*1000, 5000, 10000].filter(p => p > bill);
                paid = options[Math.floor(Math.random() * options.length)];
            } else {
                bill = (Math.floor(Math.random() * 700) + 150) * 10; 
                paid = 10000;
            }
            mathQuestions.push({ 
                text: `<div class="bill-info"><div style="font-size:14px; color:#7f8c8d;">お会計</div><strong>${bill.toLocaleString()}円</strong><br><div style="font-size:14px; color:#7f8c8d; margin-top:4px;">お預かり</div><strong>${paid.toLocaleString()}円</strong></div>お釣りは？`, 
                ans: paid - bill 
            });
        }
    }

    function startMathPhase() {
        clearInterval(countdownTimer);
        showScreen('screen-math');
        
        if(currentMode === 'restaurant') {
            document.getElementById('math-header').style.display = 'inline-block';
            document.getElementById('math-header').textContent = "レジ業務";
            document.getElementById('math-header').style.backgroundColor = "#f39c12";
        } else {
            document.getElementById('math-header').style.display = 'none';
        }
        displayCurrentMath();
    }

    function displayCurrentMath() {
        document.getElementById('math-progress').textContent = 
            (currentMode === 'restaurant' ? 'お会計 ' : '計算 ') + `${currentMathIndex + 1} / ${totalMathCount}`;
        
        document.getElementById('math-question').innerHTML = mathQuestions[currentMathIndex].text;
        let input = document.getElementById('math-answer');
        input.value = "";
        input.focus();
    }

    function handleMathEnter(e) { if (e.key === 'Enter') nextMath(); }
    
    function nextMath() {
        let userAnswer = parseInt(document.getElementById('math-answer').value, 10);
        if (isNaN(userAnswer)) return; 
        if (userAnswer === mathQuestions[currentMathIndex].ans) mathScore++;
        currentMathIndex++;

        if (currentMathIndex < totalMathCount) {
            displayCurrentMath();
        } else {
            prepareRecallPhase();
        }
    }

    function prepareRecallPhase() {
        showScreen('screen-recall');
        
        if (currentMode === 'number') {
            document.getElementById('recall-title').textContent = "数字を入力";
            document.getElementById('recall-answer-number').style.display = 'block';
            document.getElementById('recall-answer-order').style.display = 'none';
            document.getElementById('recall-answer-number').value = "";
            document.getElementById('recall-answer-number').focus();
        } else {
            document.getElementById('recall-title').textContent = "注文を入力";
            document.getElementById('recall-answer-number').style.display = 'none';
            
            const orderGrid = document.getElementById('recall-answer-order');
            orderGrid.style.display = 'grid';
            orderGrid.innerHTML = "";
            
            MENU_LIST.forEach(item => {
                orderGrid.innerHTML += `
                    <div class="menu-item">
                        <span class="menu-name">${item}</span>
                        <select id="ans-qty-${item}">
                            <option value="0">0</option><option value="1">1</option>
                            <option value="2">2</option><option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                    </div>`;
            });
        }
    }

    function showResult() {
        let resultHTML = "";

        if (currentMode === 'number') {
            let recallAnswer = document.getElementById('recall-answer-number').value;
            if (recallAnswer === "") return;
            
            if (recallAnswer === targetData) {
                resultHTML += `<p class="result-text"><span class="correct">数字: 正解🎉</span></p>`;
            } else {
                resultHTML += `<p class="result-text"><span class="incorrect">数字: 不正解</span><br><span style="font-size:14px; color:#555;">正解: ${targetData}</span></p>`;
            }
        } else {
            let allCorrect = true;
            let expectedOrderHTML = "";
            
            MENU_LIST.forEach(item => {
                let userQty = parseInt(document.getElementById(`ans-qty-${item}`).value, 10);
                let correctQty = targetData[item] || 0;
                if (userQty !== correctQty) allCorrect = false;
                if (correctQty > 0) expectedOrderHTML += `・${item}: ${correctQty}つ<br>`;
            });

            if (allCorrect) {
                resultHTML += `<p class="result-text"><span class="correct">オーダー: 完璧です🍜</span></p>`;
            } else {
                resultHTML += `<p class="result-text"><span class="incorrect">オーダー: 注文ミス発生</span></p>
                               <div style="font-size:13px; color:#555; margin-top:5px;"><strong>正しい注文:</strong><br>${expectedOrderHTML}</div>`;
            }
        }

        let mathLabel = currentMode === 'restaurant' ? "レジ業務" : "計算問題";
        resultHTML += `<hr style="margin: 10px 0; border: 0; border-top: 1px solid #ddd;"><p class="result-text">${mathLabel}: <strong>${mathScore} / ${totalMathCount} 問 正解</strong></p>`;

        document.getElementById('result-details').innerHTML = resultHTML;
        showScreen('screen-result');
    }

    function resetTraining() {
        clearInterval(countdownTimer);
        showScreen('screen-start');
    }
</script>

</body>
</html>
